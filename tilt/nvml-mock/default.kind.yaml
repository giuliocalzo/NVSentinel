#
# The workers carry nvml-mock.nvidia.com/type=sgpu, which the nvml-mock chart selects on.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
  - role: worker
    labels:
      nvml-mock.nvidia.com/type: sgpu
  - role: worker
    labels:
      nvml-mock.nvidia.com/type: sgpu
